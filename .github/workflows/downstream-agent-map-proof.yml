name: Downstream agent-map compatibility proof

on:
  push:
    branches:
      - feature/guarded-provenance-reuse-*
    paths:
      - .github/workflows/downstream-agent-map-proof.yml
      - src/Graph/GraphProjectionDigest.php
      - src/Sqlite/GraphStore.php
      - src/Sqlite/SqliteRelationStore.php
  pull_request:
    paths:
      - .github/workflows/downstream-agent-map-proof.yml
      - src/Graph/GraphProjectionDigest.php
      - src/Sqlite/GraphStore.php
      - src/Sqlite/SqliteRelationStore.php
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer:
    name: agent-map with candidate agent-graph
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          path: agent-graph
      - uses: actions/checkout@v7
        with:
          repository: voku/agent-map
          path: agent-map
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Resolve unmerged owner checkout as agent-map's dependency
        working-directory: agent-map
        shell: bash
        run: |
          set -euo pipefail
          composer config repositories.guard-graph '{"type":"path","url":"../agent-graph","options":{"symlink":true,"versions":{"voku/agent-graph":"0.3.1"}}}'
          # agent-map intentionally has no tracked lock file; partial updates are invalid.
          composer update --no-interaction --prefer-dist
          php -r '
            require "vendor/autoload.php";
            $path = (new ReflectionClass(\voku\AgentGraph\Sqlite\GraphStore::class))->getFileName();
            if (!is_string($path) || !str_contains(realpath($path) ?: "", "/agent-graph/src/")) {
                throw new RuntimeException("Agent-map did not load the candidate owner checkout: " . var_export($path, true));
            }
            if (!method_exists(\voku\AgentGraph\Sqlite\GraphStore::class, "advanceProvenanceIfUnchanged")) {
                throw new RuntimeException("Candidate GraphStore API not available.");
            }
            echo "Loaded candidate agent-graph: $path\n";
          '

      - name: Downstream consumer test and static analysis
        working-directory: agent-map
        run: composer ci

      - name: PHPStan-backed agent-map build against candidate graph
        working-directory: agent-map
        shell: bash
        run: |
          set -euo pipefail
          php bin/agent-map build --root="$PWD" --paths=src --out="$RUNNER_TEMP/agent-map-graph-candidate.json"
          test -s "$RUNNER_TEMP/agent-map-graph-candidate.graph.sqlite"
          test -s "$RUNNER_TEMP/agent-map-graph-candidate.relations.json"
          php -r '
            require "vendor/autoload.php";
            $store = \voku\AgentGraph\Sqlite\GraphStore::openReadOnly(getenv("RUNNER_TEMP") . "/agent-map-graph-candidate.graph.sqlite");
            if ($store->relationCount() < 100 || $store->integrityFailures() !== []) {
                throw new RuntimeException("Downstream real graph invalid.");
            }
            echo "Candidate downstream relations: " . $store->relationCount() . "\n";
          '
