name: Update sqlite-vec runtime

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'sqlite-vec release tag to vendor, for example v0.1.9, or latest'
        required: true
        default: latest
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: pdo_sqlite

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Resolve release and vendor verified binaries
        id: vendor
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          scripts/update-sqlite-vec.sh "${REQUESTED_VERSION}"
          echo "TARGET_VERSION=$(jq -er .version resources/sqlite-vec/manifest.json)" >> "${GITHUB_ENV}"

      - name: Run package checks
        if: steps.vendor.outputs.changed == 'true'
        run: composer ci

      - name: Smoke-test the vendored extension
        if: steps.vendor.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          php <<'PHP'
          <?php

          declare(strict_types=1);

          require 'vendor/autoload.php';

          $path = \voku\AgentGraph\Sqlite\SqliteVecBinary::resolve();
          if ($path === null) {
              throw new \RuntimeException('The freshly vendored sqlite-vec binary did not resolve.');
          }
          if (!class_exists(\Pdo\Sqlite::class)) {
              throw new \RuntimeException('Pdo\\Sqlite is unavailable on the validation runner.');
          }

          $pdo = new \Pdo\Sqlite('sqlite::memory:');
          $pdo->setAttribute(\PDO::ATTR_ERRMODE, \PDO::ERRMODE_EXCEPTION);
          $pdo->loadExtension($path);

          $actualVersion = $pdo->query('SELECT vec_version()')->fetchColumn();
          $expectedVersion = getenv('TARGET_VERSION');
          if (!is_string($actualVersion) || !is_string($expectedVersion)) {
              throw new \RuntimeException('Unable to read sqlite-vec version evidence.');
          }
          if ('v' . ltrim($actualVersion, 'v') !== 'v' . ltrim($expectedVersion, 'v')) {
              throw new \RuntimeException(sprintf(
                  'sqlite-vec version mismatch: expected %s, got %s.',
                  $expectedVersion,
                  $actualVersion,
              ));
          }

          $pdo->exec('CREATE VIRTUAL TABLE vec_smoke USING vec0(rowid INTEGER PRIMARY KEY, embedding float[2])');
          $pdo->exec("INSERT INTO vec_smoke(rowid, embedding) VALUES (1, '[1.0, 0.0]'), (2, '[0.0, 1.0]')");

          $nearest = $pdo->query(
              "SELECT rowid FROM vec_smoke WHERE embedding MATCH '[1.0, 0.0]' AND k = 1",
          )->fetchColumn();
          if ((int) $nearest !== 1) {
              throw new \RuntimeException('sqlite-vec nearest-neighbour smoke test returned the wrong row.');
          }

          $pdo->exec('DELETE FROM vec_smoke WHERE rowid = 2');
          $remaining = $pdo->query('SELECT COUNT(*) FROM vec_smoke')->fetchColumn();
          if ((int) $remaining !== 1) {
              throw new \RuntimeException('sqlite-vec delete smoke test failed.');
          }

          printf("sqlite-vec %s load/create/insert/query/delete smoke test passed.\n", $actualVersion);
          PHP

      - name: Publish verified update branch
        if: steps.vendor.outputs.changed == 'true'
        id: publish
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.vendor.outputs.target_version }}
        run: |
          set -euo pipefail

          version_slug="${TARGET_VERSION#v}"
          branch="automation/sqlite-vec-${version_slug}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "${branch}"
          git add \
            resources/sqlite-vec/manifest.json \
            resources/sqlite-vec/linux-gnu-x86_64/vec0.so \
            resources/sqlite-vec/linux-gnu-arm64/vec0.so \
            docs/reference/third-party-notices.md
          git commit -m "chore: update sqlite-vec to ${TARGET_VERSION}"

          remote_sha="$(git ls-remote --heads origin "refs/heads/${branch}" | awk '{ print $1 }')"
          if [[ -n "${remote_sha}" ]]; then
            git push --force-with-lease="refs/heads/${branch}:${remote_sha}" origin "HEAD:refs/heads/${branch}"
          else
            git push origin "HEAD:refs/heads/${branch}"
          fi

          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Report verified update
        if: steps.vendor.outputs.changed == 'true'
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.vendor.outputs.target_version }}
          UPDATE_BRANCH: ${{ steps.publish.outputs.branch }}
        run: |
          set -euo pipefail

          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${{ github.event.repository.default_branch }}...${UPDATE_BRANCH}?expand=1"

          {
            echo "## sqlite-vec ${TARGET_VERSION} update ready"
            echo
            echo "The verified update was pushed to \`${UPDATE_BRANCH}\`."
            echo
            echo "Package CI and sqlite-vec load/create/insert/k-NN/delete smoke checks passed before the branch was published."
            echo
            echo "Open the update pull request: ${compare_url}"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "Verified sqlite-vec update branch: ${UPDATE_BRANCH}"
          echo "Open pull request: ${compare_url}"

      - name: Report already-current runtime
        if: steps.vendor.outputs.changed == 'false'
        run: echo "sqlite-vec ${{ steps.vendor.outputs.target_version }} is already vendored exactly."
