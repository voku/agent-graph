name: Vendor sqlite-vec binaries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify pinned sqlite-vec binaries
        shell: bash
        run: |
          set -euo pipefail

          manifest='resources/sqlite-vec/manifest.json'
          version="$(jq -r '.version | ltrimstr("v")' "${manifest}")"
          base="https://github.com/asg017/sqlite-vec/releases/download/v${version}"

          fetch_binary() {
            local platform="$1"
            local destination="resources/sqlite-vec/${platform}/vec0.so"
            local asset
            local expected_sha256
            local temporary
            local unpacked
            local binary

            asset="$(jq -r --arg platform "${platform}" '.binaries[$platform].asset' "${manifest}")"
            expected_sha256="$(jq -r --arg platform "${platform}" '.binaries[$platform].sha256' "${manifest}")"

            test -n "${asset}"
            test "${asset}" != 'null'
            test -n "${expected_sha256}"
            test "${expected_sha256}" != 'null'

            temporary="$(mktemp)"
            unpacked="$(mktemp -d)"

            curl --fail --location --silent --show-error \
              "${base}/${asset}" \
              --output "${temporary}"
            tar -xzf "${temporary}" -C "${unpacked}"

            binary="$(find "${unpacked}" -type f -name 'vec0.so' -print -quit)"
            test -n "${binary}"

            mkdir -p "$(dirname "${destination}")"
            install -m 0644 "${binary}" "${destination}"
            printf '%s  %s\n' "${expected_sha256}" "${destination}" | sha256sum --check --strict

            rm -f "${temporary}"
            rm -rf "${unpacked}"
          }

          fetch_binary 'linux-gnu-x86_64'
          fetch_binary 'linux-gnu-arm64'

      - name: Commit vendored binaries
        shell: bash
        run: |
          set -euo pipefail

          if test -z "$(git status --porcelain -- resources/sqlite-vec)"; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/sqlite-vec/linux-gnu-x86_64/vec0.so resources/sqlite-vec/linux-gnu-arm64/vec0.so
          git commit -m 'chore: vendor pinned sqlite-vec binaries'
          git push origin HEAD:${GITHUB_REF_NAME}
