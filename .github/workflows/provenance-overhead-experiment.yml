name: Experimental graph provenance overhead

on:
  push:
    branches:
      - experiment/graph-provenance-overhead-*
    paths:
      - .github/workflows/provenance-overhead-experiment.yml
      - scripts/provenance-overhead-experiment.php
  pull_request:
    paths:
      - .github/workflows/provenance-overhead-experiment.yml
      - scripts/provenance-overhead-experiment.php
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Validate research harness syntax
        run: php -l scripts/provenance-overhead-experiment.php
      - name: Compare full graph replacement and theoretical metadata lower bound
        run: php scripts/provenance-overhead-experiment.php --relations=12000 --samples=5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-provenance-php-${{ matrix.php }}
          path: ${{ runner.temp }}/agent-graph-provenance-*/result.json
          if-no-files-found: warn
