name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer ci
      - run: bash -n scripts/compare-benchmark.sh scripts/update-sqlite-vec.sh
      - name: Benchmark parity against released 0.2.3 (PHP 8.4)
        if: matrix.php == '8.4'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin refs/tags/0.2.3:refs/tags/0.2.3
          ./scripts/compare-benchmark.sh 0.2.3 -- --relations=500 --nodes=100 --runs=3
