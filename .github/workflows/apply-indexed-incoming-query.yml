name: Apply indexed incoming query patch

on:
  push:
    branches:
      - fix/indexed-incoming-query
    paths:
      - .github/workflows/apply-indexed-incoming-query.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/indexed-incoming-query
      - name: Rewrite incoming query to start from indexed targets
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/Sqlite/SqliteRelationStore.php')
          text = path.read_text()

          old_use = "use PDO;\nuse RuntimeException;"
          new_use = "use PDO;\nuse PDOStatement;\nuse RuntimeException;"
          if old_use not in text:
              raise SystemExit('PDO import anchor not found')
          text = text.replace(old_use, new_use, 1)

          old_incoming = '''    /** @return list<GraphRelation> */
    public function incoming(string $targetId, ?string $kind = null): array
    {
        $this->assertReadable();

        return $this->relationsFor(
            'EXISTS (
                SELECT 1 FROM graph_relation_targets matched
                WHERE matched.relation_id = r.relation_id AND matched.target_id = :node_id
            )',
            $targetId,
            $kind,
        );
    }
'''
          new_incoming = '''    /** @return list<GraphRelation> */
    public function incoming(string $targetId, ?string $kind = null): array
    {
        $this->assertReadable();

        $kindPredicate = $kind === null ? '' : ' AND r.kind = :kind';
        $statement = $this->pdo->prepare(
            'SELECT r.relation_id, r.source_id, r.kind, r.relation_position,
                    t.target_id, t.target_position
             FROM graph_relation_targets matched
             JOIN graph_relations r ON r.relation_id = matched.relation_id
             JOIN graph_relation_targets t ON t.relation_id = r.relation_id
             WHERE matched.target_id = :node_id' . $kindPredicate . '
             ORDER BY r.relation_position, t.target_position',
        );
        $parameters = ['node_id' => $targetId];
        if ($kind !== null) {
            $parameters['kind'] = $kind;
        }
        $statement->execute($parameters);

        return $this->relationsFromStatement($statement);
    }
'''
          if old_incoming not in text:
              raise SystemExit('incoming method anchor not found')
          text = text.replace(old_incoming, new_incoming, 1)

          old_tail = '''        $statement->execute($parameters);

        /** @var array<string, array{source_id: string, kind: string, target_ids: list<string>}> $grouped */
        $grouped = [];
        /** @var list<string> $order */
        $order = [];

        foreach ($statement->fetchAll(PDO::FETCH_ASSOC) as $row) {
            if (!is_array($row)) {
                throw new RuntimeException('SQLite graph relation row is not an array.');
            }

            $relationId = $this->stringColumn($row['relation_id'] ?? null, 'relation_id');
            if (!isset($grouped[$relationId])) {
                $grouped[$relationId] = [
                    'source_id' => $this->stringColumn($row['source_id'] ?? null, 'source_id'),
                    'kind' => $this->stringColumn($row['kind'] ?? null, 'kind'),
                    'target_ids' => [],
                ];
                $order[] = $relationId;
            }
            $grouped[$relationId]['target_ids'][] = $this->stringColumn($row['target_id'] ?? null, 'target_id');
        }

        $relations = [];
        foreach ($order as $relationId) {
            $row = $grouped[$relationId];
            $relations[] = new GraphRelation($relationId, $row['source_id'], $row['kind'], $row['target_ids']);
        }

        return $relations;
    }

    private function stringColumn(mixed $value, string $column): string
'''
          new_tail = '''        $statement->execute($parameters);

        return $this->relationsFromStatement($statement);
    }

    /** @return list<GraphRelation> */
    private function relationsFromStatement(PDOStatement $statement): array
    {
        /** @var array<string, array{source_id: string, kind: string, target_ids: list<string>}> $grouped */
        $grouped = [];
        /** @var list<string> $order */
        $order = [];

        foreach ($statement->fetchAll(PDO::FETCH_ASSOC) as $row) {
            if (!is_array($row)) {
                throw new RuntimeException('SQLite graph relation row is not an array.');
            }

            $relationId = $this->stringColumn($row['relation_id'] ?? null, 'relation_id');
            if (!isset($grouped[$relationId])) {
                $grouped[$relationId] = [
                    'source_id' => $this->stringColumn($row['source_id'] ?? null, 'source_id'),
                    'kind' => $this->stringColumn($row['kind'] ?? null, 'kind'),
                    'target_ids' => [],
                ];
                $order[] = $relationId;
            }
            $grouped[$relationId]['target_ids'][] = $this->stringColumn($row['target_id'] ?? null, 'target_id');
        }

        $relations = [];
        foreach ($order as $relationId) {
            $row = $grouped[$relationId];
            $relations[] = new GraphRelation($relationId, $row['source_id'], $row['kind'], $row['target_ids']);
        }

        return $relations;
    }

    private function stringColumn(mixed $value, string $column): string
'''
          if old_tail not in text:
              raise SystemExit('relationsFor tail anchor not found')
          text = text.replace(old_tail, new_tail, 1)

          path.write_text(text)
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Sqlite/SqliteRelationStore.php
          git diff --cached --check
          git commit -m 'fix(sqlite): use target index for incoming relations'
          git push origin HEAD:fix/indexed-incoming-query
